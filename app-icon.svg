<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 흑백 행성: 어두운 원판 + 밝은 테두리, 기울어진 궤도 고리, 강조색(터미널 그린) 위성.
       오브(src/windows/orb/Orb.tsx)와 같은 형태. 색은 devzip 다크 토큰을 그대로 쓴다. -->

  <!-- 고리 뒤쪽 절반 (원판에 가려지는 부분) -->
  <g transform="rotate(-24 512 512)">
    <path d="M132 512 a380 120 0 0 1 760 0" fill="none" stroke="#A9A9A9" stroke-width="28"/>
  </g>

  <!-- 원판 -->
  <circle cx="512" cy="512" r="300" fill="#171717" stroke="#F2F2F2" stroke-width="20"/>

  <!-- 고리 앞쪽 절반 -->
  <g transform="rotate(-24 512 512)">
    <path d="M132 512 a380 120 0 0 0 760 0" fill="none" stroke="#F2F2F2" stroke-width="28"/>
    <!-- 고리 위를 도는 작은 위성 -->
    <circle cx="892" cy="512" r="46" fill="#3DD68C"/>
  </g>
</svg>