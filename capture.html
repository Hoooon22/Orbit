<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Capture</title>
    <!-- 모니터 전체를 덮는 투명 창. 찍어 둔 화면을 배경으로 그리므로 바탕색을 칠하지 않는다 -->
    <style>
      html, body, #root { background: transparent; margin: 0; height: 100%; }
    </style>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body class="capture-window">
    <div id="root"></div>
    <script type="module" src="/src/windows/capture/main.tsx"></script>
  </body>
</html>
