<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
    <!-- 오브 창은 투명해야 하므로 index.html과 달리 바탕색을 칠하지 않는다 -->
    <style>
      html, body, #root { background: transparent; margin: 0; height: 100%; }
    </style>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/windows/orb/main.tsx"></script>
  </body>
</html>
