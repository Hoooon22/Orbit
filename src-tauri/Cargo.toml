[package]
# 실행 파일 이름(orbit.exe)이 여기서 나온다. 옛 DesktopMemo(app.exe)의 언인스톨러가
# 같은 이름의 프로세스를 죽이지 않도록 반드시 다른 이름을 쓴다.
name = "orbit"
version = "0.3.0"
description = "화면 구석에 늘 떠 있는 Windows 개인 비서 (메모·할 일·일정·클립보드·런처)"
authors = ["kwonkim"]
license = ""
repository = "https://github.com/Hoooon22/Orbit"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["tray-icon", "protocol-asset"] }
trash = "5"
notify = "8"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# 팝업 모드 창 반투명(레이어드 윈도우) — Tauri에 창 투명도 API가 없어 직접 호출한다
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
